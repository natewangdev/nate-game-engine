[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nate-game-engine"
version = "0.1.0"
description = "Nate Game Engine: Python toolkit for game scripting (input, capture, vision)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nate" }]
keywords = ["game", "automation", "hid", "capture", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.26",
    "dxcam>=0.0.5",
    "mss>=9.0",
    "pyserial>=3.5",
    "pillow>=12.3.0",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.17",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nge2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["BLE001", "PYI034", "S110", "RUF100", "RUF046"]

[dependency-groups]
dev = [
    "onnx>=1.23.0",
]
